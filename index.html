<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetNote Documents</title>
<style>
:root{--bg:#dfe5ee;--bar:#0b1220;--b:#0a6cf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1a}}
:root[data-theme="dark"]{--bg:#0a0f1a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font:13px/1.45 Arial,Helvetica,sans-serif;color:#1f2937}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:#fff;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar select,.bar button{font:600 14px Arial,sans-serif;padding:9px 12px;border-radius:8px;border:0}
.bar #pr{background:#25D366;color:#fff}.bar #nw{background:#33415c;color:#fff}.bar small{color:#9fb0cc;flex-basis:100%}
.paper{width:210mm;max-width:100%;margin:14px auto;background:#fff;color:#1f2937;padding:12mm;box-shadow:0 4px 24px rgba(0,0,0,.2)}
.f{width:100%;border:1px solid #dfe5ee;background:#fffbe0;padding:4px 6px;font:inherit;border-radius:3px;color:#0a2a8a}
select.f{width:auto}textarea.f{resize:vertical}
.hd{display:flex;justify-content:space-between;gap:16px;border-bottom:4px solid var(--b);padding-bottom:10px;margin-bottom:12px}
.hd>div:first-child{flex:1.2}.lg{height:62px;max-width:230px;object-fit:contain;display:block}.tg{font-size:10px;color:#777;font-style:italic;margin:2px 0 4px}
.rt{flex:1;text-align:right}.ti{font:700 22px Arial,sans-serif;color:#7a869a;margin-bottom:6px}
.rt label{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-weight:700;margin-bottom:3px}.rt .sm{width:130px}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.bt b,.sec{display:block;background:var(--b);color:#fff;padding:4px 8px;margin-bottom:4px;font-size:12px}
.bt .f{margin-bottom:3px}
table{width:100%;border-collapse:collapse}.it th{background:var(--b);color:#fff;padding:5px;font-size:12px}.it td{border:1px solid #dfe5ee;padding:2px}
.it td:first-child{width:24px;text-align:center}.it td:nth-child(3){width:50px}.it td:nth-child(4){width:50px}.it td:nth-child(5){width:96px}.it td:nth-child(6){width:96px}
.c{text-align:center}.r{text-align:right}.am{padding:4px 6px!important;font-weight:700}
.tt{width:300px;margin:8px 0 12px auto}.tt td{padding:3px 6px;border-bottom:1px solid #eef1f6}.tt .gt td{background:#0b1220;color:#fff;font-weight:700;font-size:14px}.tt .red td:last-child{color:#c62828}
.tt .f{padding:2px 4px}.tt input[type=number].f{width:100px}
.kv td{border:1px solid #dfe5ee;padding:3px 6px}.kv td:first-child{width:38%;background:#eef3fb;font-weight:700}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
textarea.f{font-size:11px;color:#444}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px;font-weight:700;font-size:11px}.sg div{border-top:1px solid #333;padding-top:3px}
.thx{color:var(--b);font-weight:700;font-size:15px;margin-top:10px}
@media(max-width:700px){.paper{padding:12px}.hd,.bt{display:block}.rt{text-align:left;margin-top:8px}.rt label{justify-content:flex-start}.it td:nth-child(3){display:none}.it th:nth-child(3){display:none}}
@media print{@page{size:A4;margin:10mm}body{background:#fff}.bar{display:none}.paper{box-shadow:none;margin:0;padding:0;width:auto}
.f{border:0!important;background:none!important;padding:1px 0!important;appearance:none;-webkit-appearance:none;resize:none;overflow:visible}
input::placeholder,textarea::placeholder{color:transparent}tr.empty{display:none}tr{break-inside:avoid}.bt .f{margin:0}textarea.f{resize:none}.f:focus{outline:none}input[type=date]::-webkit-calendar-picker-indicator{display:none}input[type=number]::-webkit-inner-spin-button{display:none}}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style></head><body>
<div class="bar"><select id="co"><option>Security</option><option>Systems</option><option>Aero</option></select>
<select id="dt"><option value="Quotation">Quotation</option><option value="Invoice">Invoice</option><option value="Receipt">Receipt</option><option value="Certificate">Completion Certificate</option></select>
<button id="pr">🖨 Save as PDF / Print</button><button id="nw">＋ New document</button>
<small>Type in the yellow boxes, then tap Save as PDF. In the print window choose “Save as PDF” as the printer. Your business details are remembered for next time.</small></div>

h+=`<b class="sec">WORK COMPLETED</b><textarea id="wk" class="f" rows="3" placeholder="Describe the work done"></textarea><b class="sec" style="margin-top:8px">EQUIPMENT / DELIVERABLES</b><table class="it" id="eqt"><thead><tr><th>#</th><th>Item</th><th>Brand / model</th><th style="width:44px">Qty</th><th>Serial no.</th></tr></thead><tbody>${e}</tbody></table><b class="sec" style="margin-top:8px">HANDOVER CHECKLIST</b><table class="kv">${k}</table><b class="sec" style="margin-top:8px">WARRANTY</b>`+T('wt','Workmanship warranty: 12 months from the completion date above, covering faults caused by installation.\nWarranty does not cover damage from misuse, power surges, water, theft, vandalism or work by other parties.\nEquipment is covered by the manufacturer’s warranty terms.',4)+sg('Client: I confirm the work is complete and handed over','For '+C.n)}
$('paper').innerHTML=h;calc()}
function calc(){let s=0;for(let i=1;i<=10;i++){const d=$('d'+i);if(!d)break;const q=+$('q'+i).value,p=+$('p'+i).value,a=q&&p?q*p:0;$('a'+i).textContent=a?fmt(a):'';s+=a;d.closest('tr').classList.toggle('empty',!d.value&&!a)}
document.querySelectorAll('#eqt tbody tr').forEach(r=>r.classList.toggle('empty',![...r.querySelectorAll('input')].some(x=>x.value)));
if($('dte')&&$('vu')&&$('dte').value)$('vu').textContent=addDays($('dte').value,14);
if($('sub')){const dis=+$('dis').value||0,vr=$('vat').value==='Yes'?(+$('vp').value||0)/100:0,v=(s-dis)*vr,t=s-dis+v;$('sub').textContent=fmt(s);$('vtt').textContent=fmt(v);$('vr').classList.toggle('empty',!vr);$('tot').textContent=fmt(t);
if($('dep'))$('dep').textContent=fmt(t*(+$('dp').value||0)/100);if($('pd')){const b=t-(+$('pd').value||0);$('bal').textContent=fmt(b);$('sts').textContent=t>0?(b<=0?'PAID':'UNPAID'):''}}
else if($('it'))$('bal').textContent=fmt((+$('it').value||0)-(+$('tp').value||0))}
$('paper').addEventListener('input',e=>{const t=e.target;if(t.classList.contains('keep'))S(C.c+':'+(t.dataset.k||t.id),t.value);calc()});
$('co').onchange=$('dt').onchange=render;
